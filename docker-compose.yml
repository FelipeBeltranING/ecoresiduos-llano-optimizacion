
services:
  db:
    image: postgres:17-alpine
    container_name: orion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion}
      POSTGRES_DB: ${POSTGRES_DB:-ecoresiduos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion} -d ${POSTGRES_DB:-ecoresiduos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: orion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD:-orion}@db:5432/${POSTGRES_DB:-ecoresiduos}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OSRM_HABILITADO: ${OSRM_HABILITADO:-true}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: orion-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
