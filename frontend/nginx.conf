server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API se resuelve por la red interna de Docker Compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
